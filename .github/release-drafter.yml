name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'
exclude-labels:
  - 'skip-changelog'
replacers:
  - search: '/CVE-(\d{4})-(\d+)/g'
    replace: 'https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-$1-$2'
categories:
  - title: '💥 BREAKING CHANGES'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'documentation'
      - 'ci'
      - 'refactor'
      - 'style'
      - 'test'
  - title: '🔒 Security'
    labels:
      - 'security'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'refactor'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'documentation'
      - 'ci'
      - 'style'
      - 'test'
  default: patch
# Only the PR title sets the label: feature PRs update the docs (and sometimes CI) as well, and
# release-drafter lists a PR under every category that matches one of its labels
autolabeler:
  - label: 'breaking'
    title:
      - '/!:/'
    body:
      - '/BREAKING CHANGE/'
  - label: 'chore'
    title:
      - '/^chore(\([a-z]*\))?!?:/i'
  - label: 'ci'
    title:
      - '/^(ci|build)(\([a-z]*\))?!?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\([a-z]*\))?!?:/i'
  - label: 'enhancement'
    title:
      - '/^(feat|perf)(\([a-z]*\))?!?:/i'
  - label: 'bug'
    title:
      - '/^(fix|hotfix|bug)(\([a-z]*\))?!?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\([a-z]*\))?!?:/i'
  - label: 'revert'
    title:
      - '/^revert(\([a-z]*\))?!?:/i'
  - label: 'style'
    title:
      - '/^style(\([a-z]*\))?!?:/i'
  - label: 'test'
    title:
      - '/^test(\([a-z]*\))?!?:/i'
template: |
  ## Changes

  $CHANGES
