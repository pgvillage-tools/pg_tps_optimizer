name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a PR cancels the CI run that is still running for the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  codechanges:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust_any_changed }}
      docker: ${{ steps.filter.outputs.docker_any_changed }}
      ci: ${{ steps.filter.outputs.ci_any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        with:
          # rust: anything that changes how the crate builds, lints or tests (incl. e2e tests)
          # docker: changes to the image itself, or to the dependencies it compiles
          # ci: run everything when this workflow changes, to validate it is working
          files_yaml: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '**/clippy.toml'
              - '**/rustfmt.toml'
            docker:
              - 'Containerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
            ci:
              - '.github/workflows/ci-run-on-pr.yaml'

  lint:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ (needs.codechanges.outputs.rust == 'true' || needs.codechanges.outputs.ci == 'true') && github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # rustfmt needs no compilation, so fail fast before building anything
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # clippy also does everything `cargo check` does
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ (needs.codechanges.outputs.rust == 'true' || needs.codechanges.outputs.ci == 'true') && github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run cargo test
        run: cargo test

  e2e-test:
    name: Run e2e tests (testcontainers)
    runs-on: ubuntu-latest
    # Only run after unit tests passed
    needs:
      - codechanges
      - unit-test
    if: ${{ (needs.codechanges.outputs.rust == 'true' || needs.codechanges.outputs.ci == 'true') && github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The e2e tests start their own PostgreSQL containers on the runner's docker
      - name: Run e2e tests
        run: cargo test --test e2e -- --ignored

  docker-build:
    name: Build docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - codechanges
    # Not a job condition: GitHub reports a skipped matrix job under its unexpanded name
    # (`${{ matrix.platform }}`), so a required check like "Build docker image (linux/amd64)"
    # would never be reported. Instead the job always runs, and skips its steps.
    env:
      BUILD_IMAGE: ${{ (needs.codechanges.outputs.docker == 'true' || needs.codechanges.outputs.ci == 'true') && github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners per platform, which is much faster than emulating arm64 with QEMU
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD_IMAGE == 'true'
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.BUILD_IMAGE == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same build as the release workflow, but loaded locally instead of pushed
      - name: Build docker image
        if: env.BUILD_IMAGE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: pg_tps_optimizer:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test docker image
        if: env.BUILD_IMAGE == 'true'
        run: docker run --rm pg_tps_optimizer:ci --help
