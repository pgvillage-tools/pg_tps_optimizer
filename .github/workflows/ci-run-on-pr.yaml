name: CI run on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # In the merge queue everything runs: path filters and draft conditions only apply to pull requests
  merge_group:

permissions:
  contents: read

# A new push to a PR cancels the CI run that is still running for the previous push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  codechanges:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      docker: ${{ steps.decide.outputs.docker }}
      docs: ${{ steps.decide.outputs.docs }}
    steps:
      # changed-files only works on pull requests
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # rust: anything that changes how the crate builds, lints or tests (incl. e2e tests)
          # docker: changes to the image itself, or to the dependencies it compiles
          # ci: run everything when this workflow changes, to validate it is working
          files_yaml: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '**/clippy.toml'
              - '**/rustfmt.toml'
            docker:
              - 'Containerfile'
              - '.dockerignore'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'mkdocs_overrides/**'
              - 'docs-requirements.txt'
            ci:
              - '.github/workflows/ci-run-on-pr.yaml'
      - name: Decide which jobs to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CI_CHANGED: ${{ steps.filter.outputs.ci_any_changed }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust_any_changed }}
          DOCKER_CHANGED: ${{ steps.filter.outputs.docker_any_changed }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs_any_changed }}
        run: |
          if [ "${EVENT}" != pull_request ]; then
            # Everything runs in the merge queue
            rust=true docker=true docs=true
          elif [ "${DRAFT}" = true ]; then
            # Draft PRs run nothing until they are ready for review
            rust=false docker=false docs=false
          elif [ "${CI_CHANGED}" = true ]; then
            # Run everything when this workflow changes, to validate it is working
            rust=true docker=true docs=true
          else
            rust=${RUST_CHANGED:-false} docker=${DOCKER_CHANGED:-false} docs=${DOCS_CHANGED:-false}
          fi
          echo "rust=${rust} docker=${docker} docs=${docs}"
          {
            echo "rust=${rust}"
            echo "docker=${docker}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"

  lint:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # rustfmt needs no compilation, so fail fast before building anything
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # clippy also does everything `cargo check` does
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.docs == 'true' }}
    env:
      # See the MkDocs 2 / ProperDocs notice: https://properdocs.org/
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: docs-requirements.txt
      - name: Install Python dependencies
        run: pip install -r docs-requirements.txt
      # Strict: broken links, pages missing from the navigation etc. fail the build
      - name: Build documentation
        run: mkdocs build --strict

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run cargo test
        run: cargo test

  # Known vulnerabilities (RustSec advisories) in the dependencies. Only vulnerabilities fail the
  # job; warnings, like unmaintained crates, are shown in the log.
  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    needs:
      - codechanges
    if: ${{ needs.codechanges.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  e2e-test:
    name: Run e2e tests (PostgreSQL ${{ matrix.pgversion }})
    runs-on: ubuntu-latest
    # Only run after unit tests passed
    needs:
      - codechanges
      - unit-test
    if: ${{ needs.codechanges.outputs.rust == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        pgversion: ['14', '15', '16', '17', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Pull the image once, with retries, before the tests start their containers: otherwise the
      # first tests all pull it at the same time, and a failing download fails a test
      - name: Pull the PostgreSQL image
        env:
          PGVERSION: ${{ matrix.pgversion }}
        run: |
          for attempt in 1 2 3 4 5; do
            docker pull "postgres:${PGVERSION}" && exit 0
            echo "Pulling postgres:${PGVERSION} failed (attempt ${attempt}), retrying"
            sleep $((attempt * 10))
          done
          exit 1
      # The e2e tests start their own PostgreSQL containers on the runner's docker
      - name: Run e2e tests
        run: cargo test --test e2e -- --ignored
        env:
          PGVERSION: ${{ matrix.pgversion }}

  # One check for all PostgreSQL versions, to require in branch protection. It passes when all
  # versions passed, or when the e2e tests were skipped (no Rust changes, or draft PR).
  e2e-test-status:
    name: Run e2e tests (testcontainers)
    runs-on: ubuntu-latest
    needs:
      - e2e-test
    if: always()
    steps:
      - name: Check e2e results
        env:
          RESULT: ${{ needs.e2e-test.result }}
        run: |
          echo "e2e result: ${RESULT}"
          [ "${RESULT}" = "success" ] || [ "${RESULT}" = "skipped" ]

  docker-build:
    name: Build docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - codechanges
    # Not a job condition: GitHub reports a skipped matrix job under its unexpanded name
    # (`${{ matrix.platform }}`), so a required check like "Build docker image (linux/amd64)"
    # would never be reported. Instead the job always runs, and skips its steps.
    env:
      BUILD_IMAGE: ${{ needs.codechanges.outputs.docker }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners per platform, which is much faster than emulating arm64 with QEMU
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD_IMAGE == 'true'
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.BUILD_IMAGE == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same build as the release workflow, but loaded locally instead of pushed
      - name: Build docker image
        if: env.BUILD_IMAGE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: pg_tps_optimizer:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test docker image
        if: env.BUILD_IMAGE == 'true'
        run: docker run --rm pg_tps_optimizer:ci --help

  # The only required check of this workflow, so the ruleset doesn't change when jobs are added. It must always run,
  # and only passes when every job it needs succeeded (a skipped required check would count as a pass).
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    needs:
      - codechanges
      - lint
      - docs
      - unit-test
      - audit
      - e2e-test
      - e2e-test-status
      - docker-build
    if: always()
    steps:
      - name: Evaluate the results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Results: ${RESULTS} (event: ${EVENT})"
          # A job skipped by a path filter is fine on a pull request; everywhere else everything must run
          if [ "${EVENT}" = pull_request ]; then ok='. == "success" or . == "skipped"'; else ok='. == "success"'; fi
          if [ "$(echo "${RESULTS}" | jq -r "all(${ok})")" != true ]; then
            echo "::error::All CI jobs must succeed"
            exit 1
          fi
