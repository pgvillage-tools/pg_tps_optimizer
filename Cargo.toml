[package]
name = "pg_tps_optimizer"
version = "0.2.2"
authors = ["Sebastiaan Mannem <sebastiaan.mannem@enterprisedb.com>"]
edition = "2018"

[dependencies]
postgres = { version = "0.19.5", features = ["with-chrono-0_4"] }
chrono = "0.4.24"
uzers = "0.12.2"
openssl = { version = "0.10.72", features = ["vendored"] }
postgres-openssl = "0.5.0"
shellexpand = "3.1.2"
regex = "1"
num = "0.4.0"
num-traits = "0.2.15"
duration-string = "0.5.3"
more-asserts = "0.3.1"
range_check = "0.2.0"
home = "0.5.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2"
openssl-probe = "0.2.1"

[dev-dependencies]
rcgen = "0.14.10"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }
